<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>{% block title %}Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/lab.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="lab-wrap">
    <header class="lab-header">
      <div class="lab-header-top">
        <a href="{{ url_for('index') }}" class="lab-back">Course hub</a>
      </div>
      <p class="lab-header-name">David Xiao</p>
    </header>
    <main class="lab-body">
      {% block content %}{% endblock %}
    </main>
    <footer class="lab-footer">
      <p class="lab-footer-name">David Xiao</p>
    </footer>
  </div>
</body>
</html>
