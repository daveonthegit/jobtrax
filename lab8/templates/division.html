{% extends "lab_base.html" %}
{% block title %}Lab 8 — DIVISION{% endblock %}
{% block content %}
    <h1>DIVISION (entered every tournament)</h1>

    <table class="narrow">
        <tr>
            <th>Last name</th>
            <th>First name</th>
        </tr>

        {% for row in rows %}
        <tr>
            <td>{{ row["member_last_name"] }}</td>
            <td>{{ row["member_first_name"] }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
